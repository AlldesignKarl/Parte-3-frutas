name: App móvil (Mi Panel)

on:
  push:
    paths:
      - "app-movil/**"
      - ".github/workflows/app-movil.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-movil-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app-movil
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Si el repo tiene los secretos MIPANEL_KEYSTORE_B64 y MIPANEL_KEYSTORE_PASSWORD se firma
      # siempre con esa clave (las actualizaciones se instalan encima). Si no, se crea una
      # clave temporal solo para esta compilación. Nunca se guarda en el repositorio.
      - name: Preparar la firma
        env:
          KEYSTORE_B64: ${{ secrets.MIPANEL_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MIPANEL_KEYSTORE_PASSWORD }}
        run: |
          dir="$RUNNER_TEMP/firma"
          mkdir -p "$dir"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$dir/mipanel.p12"
            pass="$KEYSTORE_PASSWORD"
            echo "Firma: clave del secreto del repositorio"
          else
            pass="$(openssl rand -hex 24)"
            keytool -genkeypair -storetype PKCS12 -keystore "$dir/mipanel.p12" -alias mipanel \
              -keyalg RSA -keysize 2048 -validity 36500 -storepass "$pass" -keypass "$pass" \
              -dname "CN=Mi Panel, O=Personal, C=ES"
            echo "Firma: clave temporal (no hay secreto configurado)"
          fi
          echo "::add-mask::$pass"
          echo "MIPANEL_KEYSTORE=$dir/mipanel.p12" >> "$GITHUB_ENV"
          echo "MIPANEL_KEYSTORE_PASSWORD=$pass" >> "$GITHUB_ENV"

      - name: Compilar el APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Capturas de pantalla
        continue-on-error: true
        run: ./gradlew --no-daemon testDebugUnitTest --tests '*ScreenshotsTest'

      # Las capturas se publican aparte (versión de prueba) para poder verlas aunque falle algún test.
      - name: Publicar capturas
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(app/build/capturas/*.png)
          if [ ${#files[@]} -eq 0 ]; then echo "No hay capturas"; exit 0; fi
          gh release delete mi-panel-capturas --yes --cleanup-tag || true
          gh release create mi-panel-capturas "${files[@]}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Capturas de Mi Panel (compilación $VERSION_CODE)" \
            --notes "Capturas de cada pantalla con datos de ejemplo, generadas automáticamente."

      - name: Tests (lógica y recorrido por la app)
        run: ./gradlew --no-daemon testDebugUnitTest --tests '*LogicTest' --tests '*AppFlowTest'

      - name: Preparar APK
        if: success()
        run: cp app/build/outputs/apk/release/app-release.apk MiPanel.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiPanel-apk
          path: app-movil/MiPanel.apk
          if-no-files-found: error

      - name: Guardar capturas e informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: |
            app-movil/app/build/capturas/
            app-movil/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Publicar la versión para descargar desde el móvil
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mi-panel --yes --cleanup-tag || true
          gh release create mi-panel MiPanel.apk \
            --target "$GITHUB_SHA" \
            --title "Mi Panel (app Android) · versión 1.0.$VERSION_CODE" \
            --notes "Descarga MiPanel.apk desde el móvil y ábrelo para instalar. Antes de actualizar, guarda una copia de seguridad desde la app (menú ⋮ de Tareas o Notas)."
